  // Attach Protection Event Listeners
  function attachProtection() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);

    document.addEventListener('selectstart', function(e) {
      var tag = e.target.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') e.preventDefault();
    }, true);

    document.addEventListener('dragstart', function(e) { e.preventDefault(); }, true);

    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.keyCode === 75)) ||
         (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 65 || e.keyCode === 67 || e.keyCode === 80))) {
        e.preventDefault();
        e.stopPropagation();
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey) || (e.ctrlKey && e.keyCode === 85)) {
          killSession();
        }
        return false;
      }
    }, true);

    var style = document.createElement('style');
    style.innerHTML = '*, *::before, *::after { -webkit-user-select: none !important; user-select: none !important; -webkit-user-drag: none !important; } input, textarea, select { user-select: text !important; }';
    document.head.appendChild(style);
  }

  setTimeout(attachProtection, 150);

  // Monitor Window Dimensions for DevTools Docking
  var threshold = 160;
  setInterval(function() {
    var widthDiff = window.outerWidth - window.innerWidth > threshold;
    var heightDiff = window.outerHeight - window.innerHeight > threshold;
    if (widthDiff || heightDiff) {
      killSession();
    }
  }, 500);
})();
